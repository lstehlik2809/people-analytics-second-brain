name: Deploy second brain to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: [.github/brain-update-request.json]
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        description: Exact generated commit to build and deploy
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
      - name: Record exact build revision
        id: revision
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          actual=$(git rev-parse HEAD)
          if [ -n "$EXPECTED_SHA" ] && [ "$actual" != "$EXPECTED_SHA" ]; then
            echo 'Reusable deployment requires an exact full commit SHA.' >&2
            exit 1
          fi
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Quartz dependencies
        working-directory: site
        run: npm ci
      - name: Build site
        working-directory: site
        run: node --no-deprecation quartz/bootstrap-cli.mjs build -d ../vault
      - name: Add llms.txt and semantic search
        run: |
          cp pipeline/cache/llms.txt site/public/llms.txt
          cp pipeline/cache/llms-full.txt site/public/llms-full.txt
          cp pipeline/cache/semantic_index.json site/public/semantic_index.json
          cp pipeline/static/semantic-search.html site/public/semantic-search.html
          cp pipeline/static/hybrid-search.mjs site/public/hybrid-search.mjs
      - name: Add public revision marker
        env:
          BUILD_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          python3 -c 'import json,os,pathlib; pathlib.Path("site/public/brain-build.json").write_text(json.dumps({"sha": os.environ["BUILD_SHA"]}) + "\n")'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages with extended monitoring
        uses: actions/github-script@v9
        env:
          BUILD_SHA: ${{ needs.build.outputs.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const buildVersion = process.env.BUILD_SHA
            const artifactName = "github-pages"

            const artifactsResponse = await github.request(
              "GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts",
              { owner, repo, run_id: context.runId, name: artifactName }
            )
            const artifacts = artifactsResponse.data.artifacts
            if (artifacts.length !== 1) {
              throw new Error(
                `Expected one ${artifactName} artifact, found ${artifacts.length}`
              )
            }

            const idToken = await core.getIDToken()
            const created = await github.request(
              "POST /repos/{owner}/{repo}/pages/deployments",
              {
                owner,
                repo,
                artifact_id: artifacts[0].id,
                pages_build_version: buildVersion,
                oidc_token: idToken,
              }
            )
            const deployment = created.data
            const deploymentId = deployment.id
              || deployment.status_url?.split("/").pop()
              || buildVersion
            core.setOutput("page_url", deployment.page_url || "")
            core.info(`Created Pages deployment ${deploymentId}`)

            const terminalErrors = new Set([
              "deployment_failed",
              "deployment_content_failed",
              "deployment_cancelled",
              "deployment_lost",
            ])
            const delay = (milliseconds) =>
              new Promise((resolve) => setTimeout(resolve, milliseconds))
            const started = Date.now()
            const maxWait = 30 * 60 * 1000
            let readErrors = 0

            while (Date.now() - started < maxWait) {
              await delay(15_000)
              try {
                const response = await github.request(
                  "GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}",
                  { owner, repo, deploymentId }
                )
                const status = response.data.status
                core.info(`Current Pages status: ${status}`)
                readErrors = 0
                if (status === "succeed") {
                  core.setOutput("status", status)
                  return
                }
                if (terminalErrors.has(status)) {
                  throw new Error(`Pages deployment ended with ${status}`)
                }
              } catch (error) {
                if (error.message.startsWith("Pages deployment ended")) throw error
                readErrors += 1
                core.warning(`Could not read Pages status (${readErrors}/10): ${error.message}`)
                if (readErrors >= 10) throw error
              }
            }

            // Leave an accepted deployment active so GitHub can still finish it;
            // the stock action cancels at ten minutes, which caused the retry loop.
            throw new Error(
              `Pages deployment ${deploymentId} is still active after 30 minutes`
            )
      - name: Verify the live revision and public exports
        uses: actions/github-script@v9
        env:
          BUILD_SHA: ${{ needs.build.outputs.sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            const base = process.env.PAGE_URL.replace(/\/$/, "")
            if (!base) throw new Error("Pages did not return a deployment URL")
            const delay = ms => new Promise(resolve => setTimeout(resolve, ms))
            for (let attempt = 1; attempt <= 12; attempt++) {
              try {
                const marker = await fetch(`${base}/brain-build.json?run=${context.runId}-${attempt}`, { cache: "no-store" })
                if (!marker.ok) throw new Error(`Revision marker HTTP ${marker.status}`)
                const revision = await marker.json()
                if (revision.sha !== process.env.BUILD_SHA) throw new Error("Live revision has not caught up")
                for (const name of ["llms.txt", "llms-full.txt", "semantic_index.json", "semantic-search.html", "hybrid-search.mjs"]) {
                  const response = await fetch(`${base}/${name}`, { cache: "no-store" })
                  if (!response.ok || !(await response.text()).length) throw new Error(`Missing live export: ${name}`)
                }
                await core.summary.addRaw(`Verified live revision ${revision.sha} at ${base}\n`).write()
                return
              } catch (error) {
                if (attempt === 12) throw error
                core.info(`Live check ${attempt}/12: ${error.message}`)
                await delay(10_000)
              }
            }
