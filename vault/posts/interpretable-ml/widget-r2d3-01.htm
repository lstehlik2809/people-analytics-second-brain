ion(TIME)\n    .attr(\"r\", rvPointSize);\n\n  yAxis = RV.append(\"g\")\n            .attr(\"class\", \"axisLabel\")\n            .attr(\"transform\",\"translate(\" + margin.left + \",0)\")\n            .call(yAxis)\n            .call(g => g.select(\".domain\").remove());\n}\n\nfunction rvCategoricalPlot(variableName, xData, xMinMax, yMinMax) {\n\n  var rvPlotHeight = h,\n      rvPlotWidth = w;\n\n  var y = d3.scaleBand()\n            .rangeRound([margin.top - additionalHeight, margin.top + rvPlotHeight])\n            .padding(0.33)\n            .domain(xMinMax);\n\n  var yGrid = RV.append(\"g\")\n                .attr(\"class\", \"grid\")\n                .attr(\"transform\", \"translate(\" + margin.left + \",0)\")\n                .call(d3.axisLeft(y)\n                        .tickSize(-rvPlotWidth)\n                        .tickFormat(\"\")\n                ).call(g => g.select(\".domain\").remove());\n\n  var yAxis = d3.axisLeft(y)\n                .tickSize(0);\n\n  yAxis = RV.append(\"g\")\n            .attr(\"class\", \"axisLabel\")\n            .attr(\"transform\",\"translate(\" + (margin.left - 10) + \",0)\")\n            .call(yAxis)\n            .call(g => g.select(\".domain\").remove());\n\n  yAxis.selectAll(\"text\").call(wrapText, margin.left - 15);\n\n  RV.append(\"text\")\n    .attr(\"x\", margin.left)\n    .attr(\"y\", margin.top - 15)\n    .attr(\"class\", \"smallTitle\")\n    .text(rvSubtitle);\n\n  RV.append(\"text\")\n    .attr(\"x\", margin.left)\n    .attr(\"y\", margin.top - 40)\n    .attr(\"class\", \"bigTitle\")\n    .text(rvTitle);\n\n  var x = d3.scaleLinear()\n            .range([margin.left, margin.left + rvPlotWidth])\n            .domain(yMinMax);\n\n  var xAxis = d3.axisBottom(x)\n                .ticks(5)\n                .tickSize(0);\n\n  xAxis = RV.append(\"g\")\n            .attr(\"class\", \"axisLabel\")\n            .attr(\"transform\", \"translate(0,\" + (margin.top + rvPlotHeight) + \")\")\n            .call(xAxis)\n "height\", y.bandwidth())\n      .transition()\n      .duration(TIME)\n      .delay((d,i) => i * TIME)\n      .attr(\"x\", d => d.sign == 1 ? x(yMean) : x(d.x0))\n      .attr(\"width\", d => Math.abs(x(d.x0) - x(yMean)));\n\n  // add intercept line\n  var minimumY = Number.MAX_VALUE;\n  var maximumY = Number.MIN_VALUE;\n\n  bars.selectAll(\".AT-bars\").each(function() {\n      if (+this.getAttribute('y') < minimumY) {\n        minimumY = +this.getAttribute('y');\n      }\n      if (+this.getAttribute('y') > maximumY) {\n        maximumY = +this.getAttribute('y');\n      }\n    });\n\n  AT.append(\"line\")\n    .attr(\"class\", \"interceptLine\")\n    .attr(\"x1\", x(yMean))\n    .attr(\"y1\", minimumY)\n    .attr(\"x2\", x(yMean))\n    .attr(\"y2\", maximumY + y.bandwidth());\n}\n\n/// event plot functions\n\nfunction updatePlots(event, variableName, observationId, plotId) {\n  /// main plot controller, not used arguments are passed as null\n\n  switch (event) {\n    case \"observationChange\":\n      CLICKED_OBSERVATION_ID = observationId;\n      removePlots([\"BD\", \"SV\", \"CP\"]);\n      generatePlots([\"BD\", \"SV\", \"CP\"]);\n      break;\n\n    case \"variableChange\":\n      // safeguard\n      if (variableName == \"prediction\" || variableName == \"intercept\" ||\n          variableName == \"other\") { return; }\n      CLICKED_VARIABLE_NAME = variableName;\n      removePlots([\"CP\", \"PD\", \"AD\", \"RV\", \"FD\", \"TV\", \"AT\"]);\n      generatePlots([\"CP\", \"PD\", \"AD\", \"RV\", \"FD\", \"TV\", \"AT\"]);\n      break;\n\n    case \"chosePlot\":\n      removePlots([plotId]);\n      generatePlots([plotId]);\n      break;\n\n    default:\n      console.log(\"Unknown event in updatePlots \" +\n                  [event,variableName, observationId, plotId]);\n      break;\n  }\n}\n\nfunction removePlots(arrPlotId) {\n  /// check if there is something to delete and get rid of it (with tooltip)\n  arrPlotId.forEach((id) => {\n    if (!svg.select(\"#\"+id).selectAll(\"*\").empty()) {\n      svg.select(\"#\"+id).selectAll(\"*\").remove();\n      d3.select(\"body\").select(\"#tooltip\"+id).remove();\n    }\n  });\n}\n\nfunction generatePlots(arrPlotId) {\n  /// check if the plot got removed and make new one\n  arrPlotId.forEach((id) => {\n    if (svg.select(\"#\"+id).selectAll(\"*\").empty()) {\n      // execute plot function\n      mapIdPlotFunction[id]();\n    }\n  });\n}\n\nfunction updateDropDownVar(variableName) {\n  /// change dropdown variable on bar click\n  if (variableName == \"prediction\" || variableName == \"intercept\" ||\n      variableName == \"other\") { return; }\n  d3.select('#inputVar').property('value', variableName)\n}\n\n/* R2D3 Source File:   */\n//:\\\\\\ here are functions for tooltips HTML //:\\\\\\\n\nfunction bdTooltipHtml(d) {\n  var temp = \"<center>\";\n  temp += d.tooltipText;\n  temp += \"<\/center>\";\n  return temp;\n}\n\nfunction cpStaticTooltipHtml(d) {\n  // function formats tooltip text\n  var temp = \"\";\n  for (var [k, v] of Object.entries(d)) {\n    if (k === \"yhat\") {\n      k = \"prediction\";\n      temp += \"<center>\" +  k + \": \" + v + \"<\/br>\";\n      temp += \"<\/br>\";\n    } else {\n      temp += \"<center>\" +  k + \": \" + v + \"<\/br>\";\n    }\n  }\n  return temp;\n}\n\nfunction cpChangedTooltipHtml(d, addData) {\n  // function formats tooltip text with update in red\n  var temp = \"<center>\";\n  for (var [k, v] of Object.entries(addData)) {\n    if (k === \"yhat\") {\n      temp += \"prediction:<\/br>\";\n      temp += \"- before\" + \": \" + v + \"<\/br>\";\n      temp += \"- after\" + \": \" + \"<font color = \\\"red\\\">\" + d.yhat + \"<\/br><\/font>\";\n      temp += \"<\/br>\";\n    } else if (k === d.vname) {\n      temp +=  k + \": \" + \"<font color = \\\"red\\\">\"  +  d.xhat + \"<\/br><\/font>\";\n    } else {\n      temp += k + \": \" + v + \"<\/br>\";\n    }\n  }\n  temp += \"<\/center>\";\n  return temp;\n}\n\nfunction fiStaticTooltipHtml(d) {\n    let sign;\n    if (d.dropout_loss > d.full_model) sign = \"+\"; else sign = \"\";\n    var temp =  \"<center>\" + \"model loss after feature \" + d.variable\n      + \"<\/br>\" + \"<center>\" +\n      \" is permuted: \" +  Math.round(d.dropout_loss * 1000)/1000\n      + \"<\/br>\" + \"<center>\" + \"drop-out loss change: \" +\n      sign + Math.round((d.dropout_loss-d.full_model)*1000)/1000;\n    return temp;\n}\n\nfunction pdStaticTooltipHtml(d, variableName, yMean) {\n  // function formats tooltip text\n  var temp = \"\";\n  for (var [k, v] of Object.entries(d)) {\n    switch(k){\n      case \"xhat\":\n        temp += \"<center>\" +  variableName  + \": \" + v + \"<\/br>\";\n        break;\n      case \"yhat\":\n        temp += \"<center>\" +  \"average prediction\"  + \": \" + v + \"<\/br>\";\n        break;\n      case \"vname\":\n        break;\n      default:\n        temp += \"<center>\" +  k  + \": \" + v + \"<\/br>\";\n        break;\n    }\n  }\n\n  temp += \"<\/br><center>\" +\n          \"mean observation prediction:\" +\n          \"<\/br>\" + yMean + \"<\/br>\";\n  return temp;\n}\n\nfunction adStaticTooltipHtml(d, variableName, yMean) {\n  // function formats tooltip text\n  var temp = \"\";\n  for (var [k, v] of Object.entries(d)) {\n    switch(k){\n      case \"xhat\":\n        temp += \"<center>\" +  variableName  + \": \" + v + \"<\/br>\";\n        break;\n      case \"yhat\":\n        temp += \"<center>\" +  \"accumulated prediction\"  + \": \" + v + \"<\/br>\";\n        break;\n      case \"vname\":\n        break;\n      default:\n        temp += \"<center>\" +  k  + \": \" + v + \"<\/br>\";\n        break;\n    }\n  }\n\n  temp += \"<\/br><center>\" +\n          \"mean observation prediction:\" +\n          \"<\/br>\" + yMean + \"<\/br>\";\n  return temp;\n}\n\nfunction descTooltipHtml(d) {\n  var temp = \"<center>\";\n  temp += d.text;\n  temp += \"<\/center>\";\n  return temp;\n}\nsvg = d3.select(svg.node());\n/* R2D3 Source File:   */ BTITLE) {\n  additionalHeight = 25;\n  bdSubtitle = null;\n  svSubtitle = null;\n  cpSubtitle = null;\n  fiSubtitle = null;\n  pdSubtitle = null;\n  adSubtitle = null;\n  rvSubtitle = null;\n  fdSubtitle = null;\n  tvSubtitle = null;\n  atSubtitle = null;\n}\n\n/// for plot chosing\nvar notVisiblePlots = EDA ?\n                      [{id:\"BD\", text: bdTitle + \" [Local]\"},\n                       {id:\"SV\", text: svTitle + \" [Local]\"},\n                       {id:\"CP\", text: cpTitle + \" [Local]\"},\n                       {id:\"FI\", text: fiTitle + \" [Global]\"},\n                       {id:\"PD\", text: pdTitle + \" [Global]\"},\n                       {id:\"AD\", text: adTitle + \" [Global]\"},\n                       {id:\"RV\", text: rvTitle + \" [Global]\"},\n                       {id:\"FD\", text: fdTitle + \" [EDA]\"},\n                       {id:\"TV\", text: tvTitle + \" [EDA]\"},\n                       {id:\"AT\", text: atTitle + \" [EDA]\"}] :\n                      [{id:\"BD\", text: bdTitle + \" [Local]\"},\n                       {id:\"SV\", text: svTitle + \" [Local]\"},\n                       {id:\"CP\", text: cpTitle + \" [Local]\"},\n                       {id:\"FI\", text: fiTitle + \" [Global]\"},\n                       {id:\"PD\", text: pdTitle + \" [Global]\"},\n                       {id:\"AD\", text: adTitle + \" [Global]\"}];\n\nvar visiblePlots = [];\n\n/// generate facet x,y coordinates with grid index\nvar facetData = [], id = 0;\nfor (let i = 0; i < dim[0]; i++) {\n  for (let j = 0; j < dim[1]; j++) {\n    facetData.push({x: 0 + j*plotWidth,\n                    y: studioMargin.top + i*plotHeight,\n                    index: id});\n    id++;\n  }\n}\n\n///:\\\\\\\nif (license) document.head.appendChild(document.createComment(license));\nif (telemetry) startTelemetrySession();\ninitializeStudio();\n///:\\\\\\\n\nfunction initializeStudio() {\n  /// this function initializes modelStudio (used only once, at start)\n\n  // center the ms\n  d3.select(\"#\" + WIDGET_ID)\n    .style('position', 'absolute')\n    .style('left', 0)\n    .style('right', 0)\n    .style('margin', 'auto');\n\n  // top decorations\n  var TOP_G = svg.append(\"g\")\n                 .attr(\"class\", \"TOP_G\");\n\n  TOP_G.append(\"text\")\n       .attr(\"class\", \"mainTitle\")\n       .attr(\"x\", 15)\n       .attr(\"y\", 30)\n       .text(msTitle);\n\n  if (msSubtitle !== null) {\n      TOP_G.append(\"text\")\n           .attr(\"class\", \"subTitle\")\n           .attr(\"x\", 15)\n           .attr(\"y\", 40)\n           .text(msSubtitle)\n           .call(wrapText, studioWidth - 15);\n  }\n\n  TOP_G.append(\"line\")\n       .attr(\"class\", \"mainLine\")\n       .attr(\"x1\", 10)\n       .attr(\"x2\", studioWidth - 10)\n       .attr(\"y1\", studioMargin.top - margin.big)\n       .attr(\"y2\", studioMargin.top - margin.big);\n\n  ///:\\\\\\ add select observation input\n  let ddWidth = calculateTextWidth(dropDownData.map(e => e.text))*1.6 + 18; // 15px bold 600\n\n  var input = d3.select(\"#\" + WIDGET_ID)\n                .append(\"select\")\n                .attr(\"id\", \"input\")\n                .style(\"position\", \"absolute\") // to make input appear on top\n                .style(\"left\", (studioWidth - margin.big - ddWidth)+\"px\")\n                .style(\"top\", -studioHeight + 180)\n                .style(\"font-size\", \"15px\")\n                .style(\"font-weight\", 600)\n                .style(\"color\", \"#371ea3\");\n\n  input.selectAll()\n       .data(dropDownData)\n       .enter()\n       .append(\"option\")\n       .attr(\"value\", d => d.id)\n       .text(d => d.text)\n       .style(\"font-size\", \"15px\")\n       .style(\"font-weight\", 600)\n       .style(\"color\", \"#371ea3\");\n\n  input.on(\"change\", function() {\n\n    // update observation specific plots\n    updatePlots(event = \"observationChange\",\n                variableName = null,\n                observationId = this.value,\n                plotId = null);\n  });\n  ///:\\\\\\\n\n  ///:\\\\\\ add select variable input\n  let ddWidthVar = calculateTextWidth(variableNames)*1.6 + 18; // 15px bold 600\n\n  var inputVar = d3.select(\"#\" + WIDGET_ID)\n                   .append(\"select\")\n                   .attr(\"id\", \"inputVar\")\n                   .style(\"position\", \"absolute\") // to make input appear on top\n                   .style(\"left\", (studioWidth - margin.big - ddWidthVar - margin.big - ddWidth)+\"px\")\n                   .style(\"top\", -studioHeight + 180)\n                   .style(\"font-size\", \"15px\")\n                   .style(\"font-weight\", 600)\n                   .style(\"color\", \"#371ea3\");\n\n  inputVar.selectAll()\n          .data(variableNames)\n          .enter()\n          .append(\"option\")\n          .attr(\"value\", d => d)\n          .text(d => d)\n          .style(\"font-size\", \"15px\")\n          .style(\"font-weight\", 600)\n          .style(\"color\", \"#371ea3\");\n\n  inputVar.on(\"change\", function() {\n\n    // update variable specific plots\n    updatePlots(event = \"variableChange\",\n                variableName = this.value,\n                observationId = null,\n                plotId = null);\n  });\n  ///:\\\\\\\n\n  // bottom decorations\n  var BOTTOM_G = svg.append(\"g\")\n                    .attr(\"class\", \"BOTTOM_G\");\n\n  BOTTOM_G.append(\"text\")\n          .attr(\"class\", \"footerTitle\")\n          .attr(\"x\", studioWidth - 15 - getTextWidth(versionText, 12, 'Fira Sans, sans-serif'))\n          .attr(\"y\", studioHeight - studioMargin.bottom + 25)\n          .text(versionText);\n\n  BOTTOM_G.append(\"text\")\n          .attr(\"class\", \"footerTitle\")\n          .attr(\"x\", 15)\n          .attr(\"y\", studioHeight - studioMargin.bottom + 25)\n          .text(measureText);\n\n  BOTTOM_G.append(\"line\")\n          .attr(\"class\", \"footerLine\")\n          .attr(\"x1\", 10)\n          .attr(\"x2\", stu ick\", function(d,i) {\n\n                      // block other buttons\n                      if (!IS_BUTTON_CLICKED) {\n                        IS_BUTTON_CLICKED = true;\n                        // allow for plot choice or exit choice\n                        showChoiceButtons(this, i);\n                      }\n                    });\n\n  var exitChoiceButtons = MIDDLE_G.selectAll()\n                                  .data(facetData)\n                                  .enter()\n                                  .append(\"rect\")\n                                  .attr(\"class\", \"exitChoiceButton\")\n                                  .attr(\"id\", (d,i) => \"exitChoiceButton\"+i)\n                                  .attr(\"width\", plotWidth - margin.big)\n                                  .attr(\"height\", plotHeight - margin.big)\n                                  .attr(\"x\", d => d.x + margin.small)\n                                  .attr(\"y\", d => d.y + margin.small)\n                                  .style(\"visibility\", \"hidden\");\n\n  // events\n  exitChoiceButtons.on(\"click\", function(d,i) {\n\n                     // delete chosePlotButtons\n                     svg.select(\"#chosePlotButton\"+i).remove();\n                     // hide this button\n                     svg.select(\"#exitChoiceButton\"+i).style(\"visibility\", \"hidden\");\n                     // show enterChoiceButton\n                     svg.selectAll(\"#enterChoiceButton\"+i).style(\"visibility\", \"visible\");\n                     // let the user click other buttons\n                     IS_BUTTON_CLICKED = false;\n                   });\n\n  var exitPlotButtons = MIDDLE_G.selectAll()\n                                .data(facetData)\n                                .enter()\n                                .append(\"g\")\n                                .attr(\"id\", (d,i) => \"exitPlotButton\"+i)\n                                .attr(\"transform\", d => \"translate(\" +\n                                (d.x + margin.left + w - 2*margin.big) + \",\" +\n                                (d.y + margin.small) + \")\")\n                                .style(\"visibility\", \"hidden\");\n\n  exitPlotButtons.append(\"rect\")\n                 .attr(\"class\", \"descriptionBox\")\n                 .attr(\"width\", 2*margin.big)\n                 .attr(\"height\", 2*margin.big)\n                 .attr(\"rx\", 2*margin.big)\n                 .attr(\"ry\", 2*margin.big);\n\n  exitPlotButtons.append(\"text\")\n                 .attr(\"class\", \"descriptionLabel\")\n                 .attr(\"dy\", \"1.05em\")\n                 .attr(\"x\", 6)\n                 .text(\"X\");\n\n  // events\n  exitPlotButtons.selectAll(\"*\")\n                 .on(\"mouseover\", function() { d3.select(this).style(\"cursor\", \"pointer\");})\n                 .on(\"mouseout\", function() { d3.select(this).style(\"cursor\", \"auto\");})\n                 .on(\"click\", function(d) {\n\n                   let j = d.index;\n                   // available only when no enterPlotButton clicked\n                   if (!IS_BUTTON_CLICKED) {\n                     // which plot is in this place?\n                     let temp = visiblePlots.filter(el => el.index == j)[0];\n                     // add this plot to not visible\n                     notVisiblePlots.push({text: temp.text, id: temp.id});\n                     // delete this plot from visible\n                     visiblePlots = visiblePlots.filter(el => el.id !== temp.id);\n                     // hide this button\n                     svg.select(\"#exitPlotButton\"+j).style(\"visibility\", \"hidden\");\n                     // hide plot\n                     svg.select(\"#\"+temp.id)\n                        .style(\"visibility\", \"hidden\");\n                     // show enterChoiceButton\n                     svg.selectAll(\"#enterChoiceButton\"+j).style(\"visibility\", \"visible\");\n                   }\n                 });\n\n  function showChoiceButtons(object, j) {\n    /// chosePlotButtons controller\n\n    // hide this button\n    svg.selectAll(\"#enterChoiceButton\"+j).style(\"visibility\", \"hidden\");\n    // show exitChoiceButton\n    svg.select(\"#exitChoiceButton\"+j).style(\"visibility\", \"visible\");\n\n    // where to place text?\n    let plotWidth = parseFloat(d3.select(object).attr(\"width\")),\n        plotHeight = parseFloat(d3.select(object).attr(\"height\")),\n        x = parseFloat(d3.select(object).attr(\"x\")),\n        y = parseFloat(d3.select(object).attr(\"y\"));\n\n    let chosePlotButtons = MIDDLE_G.append(\"g\")\n                                   .attr(\"id\",\"chosePlotButton\"+j);\n\n    chosePlotButtons.selectAll()\n             .data(notVisiblePlots)\n             .enter()\n             .append(\"text\")\n             .attr(\"class\", \"bigTitle\")\n             .attr(\"id\", d => d.id)\n             .attr(\"x\", x + plotWidth/2)\n             .attr(\"y\", (d,i) => y + plotHeight/2 + 25*i - (notVisiblePlots.length/2)*25)\n             .attr(\"text-anchor\", \"middle\")\n             .text(d => d.text)\n             .on(\"mouseover\", function() { d3.select(this).style(\"cursor\", \"pointer\");})\n             .on(\"mouseout\", function() { d3.select(this).style(\"cursor\", \"auto\");})\n             .on(\"click\", function(d) {\n\n               // when clicking on text, hide exitChoiceButton\n               svg.selectAll(\"#exitChoiceButton\"+j).style(\"visibility\", \"hidden\");\n               // delete chosePlotButtons\n               svg.select(\"#chosePlotButton\"+j).remove();\n               // add this plot to visible\n               visiblePlots.push({text: d.text, id: this.id, index: j });\n               // delete this plot from not visible\n               notVisiblePlots = notVisiblePlots.filter(el => el.id !== this.id);\n\n               updatePlots(event = \"chosePlot\",\n                           variableName = null,\n                           observationId = null,\n                           plotId = this.id);\n\n               // show plot and move it to the right place\n               // margin.big added because translate 0 is -10\n               svg.select(\"#\"+this.id)\n                  .attr(\"transform\",\"translate(\" + (x) + \",\" + (y + 1.5*margin.big) + \")\")\n                  .style(\"visibility\", \"visible\");\n\n               // make exit button visible\n               svg.select(\"#exitPlotButton\"+j).style(\"visibility\", \"visible\");\n\n               // let the user click other buttons\n               IS_BUTTON_CLICKED = false;\n             });\n  }\n  \n  for (let i = 0; i < openPlots.length; i++) {\n    if (facetData.length > i) {\n      svg.selectAll(\".enterChoiceButton\").filter(\"#enterChoiceButton\"+i).dispatch('click');\n      svg.select(\"#chosePlotButton\"+i).select(\"#\"+openPlots[i]).dispatch('click');\n    }\n  }\n  if (facetData.length > openPlots.length) {\n    svg.selectAll(\".enterChoiceButton\").filter(\"#enterChoiceButton\"+openPlots.length).dispatch('click');\n  }\n}\n\n///:\\\\\\\nlet telemetrySession = null;\nfunction startTelemetrySession() {\n  fetch('https://arena.mini.pw.edu.pl/telemetry/session', {\n    method: 'post',\n    body: JSON.stringify({\n      application: 'modelStudio',\n      application_version: telemetry.version,\n      data: JSON.stringify({\n        ...telemetry\n      })\n    }),\n    headers: {\n      'Accept': 'plain/text',\n      'Content-Type': 'application/json'\n    },\n  }).then(response => {\n    return response.text()\n  }).then(key => {\n    telemetrySession = key\n  }).catch(console.error)\n\n  setInterval(() => {\n    if (!telemetrySession) return\n    fetch('https://arena.mini.pw.edu.pl/telemetry/state', {\n      method: 'post',\n      body: JSON.stringify({\n        data: JSON.stringify({\n          plots: visiblePlots.map(p => p.id)\n        }),\n        uuid: telemetrySession\n      }),\n      headers: {\n        'Accept': 'plain/text',\n        'Content-Type': 'application/json'\n      },\n    })\n  }, 1000 * 20)\n}\n};","style":"/* R2D3 Source File:   */\ntext {\n  font-family:'Fira Sans';\n  font-style:normal;\n  fill: #371ea3;\n  -webkit-user-select: none;\n  -moz-user-select: none;\n  -ms-user-select: none;\n  -o-user-select: none;\n  user-select: none;\n}\n\n.bigTitle {\n  font-family:'Fira Sans';\n  font-style:normal;\n  font-weight: 700;\n  font-size: 18px;\n  text-align: left;\n}\n\n.smallTitle {\n  font-family:'Fira Sans';\n  font-style:normal;\n  font-weight: 700;\n  font-size: 13px;\n  text-align: left;\n}\n\n.axisTitle {\n  font-family:'Fira Sans';\n  font-style:normal;\n  font-weight: 700;\n  font-size: 13px;\n  text-align: center;\n}\n\n.axisLabel {\n  font-family:'Fira Sans';\n  font-style:normal;\n  font-weight: 500;\n  font-size: 11px;\n}\n\n.axisLabel .domain {\n    stroke: #371ea3;\n}\n\n.legendTitle {\n  font-family:'Fira Sans';\n  font-style: normal;\n  font-weight: 500;\n  font-size: 13px;\n  text-align: left;\n}\n\n.legendLabel {\n  font-family:'Fira Sans';\n  font-style: normal;\n  font-weight: 500;\n  font-size: 11px;\n  text-align: left;\n}\n\n.legendBox {\n  fill: #ceced9;\n  opacity: 0.5;\n}\n\n.interceptLine {\n  stroke: #371ea3;\n\tstroke-width: 1px;\n\tstroke-opacity: 1;\n\tstroke-linecap: \"butt\";\n}\n\n.dotLine {\n\tfill: none;\n\tstroke: #371ea3;\n\tstroke-width: 0.7px;\n}\n\n.grid .tick line {\n  /*stroke: #f0f0f4;*/\n  stroke: #ceced9;\n  opacity: 0.5;\n  stroke-width: 1px\n}\n\n.mainTitle {\n  font-family:'Fira Sans';\n  font-style: normal;\n  font-size: 25px;\n  font-weight: 500;\n}\n\n.subTitle {\n  font-family:'Fira Sans';\n  font-style: normal;\n  font-size: 18px;\n  font-weight: 500;\n  dominant-baseline: hanging;\n}\n\n.mainLine {\n  stroke: #371ea3;\n  stroke-width: 1.5px;\n  stroke-opacity: 1;\n  stroke-linecap: butt;\n}\n\n.footerTitle {\n  font-family:'Fira Sans';\n  font-style: normal;\n  font-size:
